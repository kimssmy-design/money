<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>단하네 가계부</title>

<!-- PWA 설정: 홈 화면 아이콘 + 주소창 없는 실행(standalone) -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="./icons/icon-192.png">

<!-- iOS(사파리)에서도 홈 화면 추가 시 아이콘/주소창 없는 실행이 되도록 -->
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단하네 가계부">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div id="screenMain">

  <header class="app-header">
    <h1>단하네 가계부</h1>
    <select id="rangePreset" class="range-select" aria-label="기간 선택">
      <option value="thisMonth" selected>이번 달</option>
      <option value="lastMonth">지난 달</option>
      <option value="custom">기간 직접 선택</option>
    </select>
  </header>

  <div id="customRangeWrap" class="custom-range hidden">
    <input type="date" id="customStart" aria-label="시작일">
    <span>~</span>
    <input type="date" id="customEnd" aria-label="종료일">
    <button id="customApply" type="button">적용</button>
  </div>

  <div class="layout">

    <!-- 왼쪽(폰에서는 전체): 요약 + 내역 -->
    <main class="main-col">

      <!-- 1. 총액 (검정 카드) -->
      <section class="hero">
        <div class="hero-range" id="rangeLabel">-</div>
        <div class="hero-total" id="totalAmount">0원</div>
        <div class="hero-streak">
          <span>🔥 선영 <b id="streakSeonyeong">0</b>일 연속 <span id="badgeSeonyeong"></span></span>
          <span>🔥 현우 <b id="streakHyunwoo">0</b>일 연속 <span id="badgeHyunwoo"></span></span>
        </div>
      </section>

      <!-- 2. 누가 썼나 / 어떻게 냈나 -->
      <section class="card">
        <h3 class="card-title">누가 썼나</h3>
        <div class="share-bar">
          <div class="share s1" id="shareBar-seonyeong"></div>
          <div class="share s2" id="shareBar-hyunwoo"></div>
          <div class="share s3" id="shareBar-gongyong"></div>
        </div>
        <div class="share-rows">
          <div class="share-row"><span class="dot s1"></span><span class="name">선영</span><span class="pct" id="writerPct-seonyeong">0%</span><span class="amt" id="writerTotal-seonyeong">0원</span></div>
          <div class="share-row"><span class="dot s2"></span><span class="name">현우</span><span class="pct" id="writerPct-hyunwoo">0%</span><span class="amt" id="writerTotal-hyunwoo">0원</span></div>
          <div class="share-row"><span class="dot s3"></span><span class="name">공용</span><span class="pct" id="writerPct-gongyong">0%</span><span class="amt" id="writerTotal-gongyong">0원</span></div>
        </div>

        <div class="divider"></div>

        <h3 class="card-title">어떻게 냈나</h3>
        <div class="pay-grid">
          <div class="pay-box"><div class="k">현금·체크카드</div><div class="v" id="cashAmount">0원</div></div>
          <div class="pay-box"><div class="k">신용카드</div><div class="v" id="cardAmount">0원</div></div>
        </div>
      </section>

      <!-- 3. 외식·간식 / 생활 -->
      <div class="tile-grid">
        <section class="tile budget" id="diningAlert">
          <div class="tile-label">🍽️ 외식·간식</div>
          <div class="tile-amt" id="diningAmount">0원</div>
          <div class="bar"><div class="bar-fill" id="diningBar"></div></div>
          <div class="tile-foot"><span id="diningMsg"></span> · <span id="diningCount">0건</span></div>
        </section>
        <section class="tile" id="groceryAlert">
          <div class="tile-label">🛒 생활</div>
          <div class="tile-amt" id="groceryAmount">0원</div>
          <div class="bar-space"></div>
          <div class="tile-foot">이번 기간 <span id="groceryCount">0건</span></div>
        </section>
      </div>

      <section class="card list-section">
        <div class="list-head">
          <h2>기록 <span class="count" id="entryCount">0건</span></h2>
          <button class="text-btn" id="copyEntriesBtn" type="button">📋 복사</button>
        </div>
        <div id="entryList"></div>
        <button class="toggle-entries-btn hidden" id="toggleEntriesBtn" type="button"></button>

        <a href="#" id="openFixedScreen" class="fixed-link">고정비 관리 ›</a>
      </section>

    </main>

    <!-- 오른쪽(폰에서는 +버튼으로 여는 시트): 입력 폼 -->
    <aside id="entryPanel" class="entry-panel" aria-label="지출 기록하기">
      <div class="panel-head">
        <h2 id="panelTitle">새 기록</h2>
        <span id="editingBadge" class="editing-badge hidden">수정 중 · <a href="#" id="cancelEditBtn">취소</a></span>
        <button class="close-btn" id="closePanelBtn" type="button" aria-label="닫기">✕</button>
      </div>

      <div class="field-row">
      <div class="field">
        <label for="entryDate">날짜</label>
        <input type="date" id="entryDate">
      </div>

      <div class="field field-amount">
        <label for="entryAmount">금액</label>
        <div class="amount-wrap">
          <input type="number" id="entryAmount" placeholder="0" inputmode="numeric" min="0" onwheel="this.blur()">
          <span class="won">원</span>
        </div>
      </div>
      </div>

      <div class="field">
        <label>카테고리</label>
        <div class="chip-grid" id="categoryChips"></div>
      </div>

      <div class="field">
        <label for="entryMemo">내용 <span class="optional">(선택)</span></label>
        <input type="text" id="entryMemo" placeholder="뭐 샀는지 적어주세요 (예: 마트 장보기)">
      </div>

      <div class="field">
        <label>작성자</label>
        <div class="seg">
          <button type="button" class="btn-toggle writer-btn" data-writer="seonyeong">선영</button>
          <button type="button" class="btn-toggle writer-btn" data-writer="hyunwoo">현우</button>
          <button type="button" class="btn-toggle writer-btn" data-writer="gongyong">공용</button>
        </div>
      </div>

      <div class="field hidden" id="loggedByField">
        <label>실제 기록자 <span class="optional">(스트릭 반영용)</span></label>
        <div class="seg">
          <button type="button" class="btn-toggle loggedby-btn" data-loggedby="seonyeong">선영</button>
          <button type="button" class="btn-toggle loggedby-btn" data-loggedby="hyunwoo">현우</button>
        </div>
      </div>

      <div class="field">
        <label>결제수단</label>
        <div class="seg">
          <button type="button" class="btn-toggle method-btn active" data-method="cash">현금·체크카드</button>
          <button type="button" class="btn-toggle method-btn" data-method="card">신용카드</button>
        </div>
      </div>

      <button class="submit-btn" id="saveBtn" type="button">저장</button>
    </aside>

  </div>

  <button id="openPanelBtn" class="fab" type="button" aria-label="기록 추가">+</button>

</div><!-- /#screenMain -->

<div id="screenFixed" class="hidden">
  <header class="sub-header">
    <button class="back" id="backToMain" type="button" aria-label="뒤로">‹</button>
    <h1>고정비 관리</h1>
  </header>

  <div class="wrap">

    <!-- 이번 달 등록하기 -->
    <section class="card">
      <h2>이번 달 등록하기</h2>
      <div class="month-hint">체크한 항목만 등록돼요. 실제 나간 날짜·금액이 다르면 그 자리에서 고치세요.</div>
      <div id="monthlyChecklist"></div>
      <button class="submit-btn" id="registerCheckedBtn" type="button">체크한 0건 등록하기</button>
    </section>

    <!-- 등록된 템플릿 목록 -->
    <section class="card">
      <h2>등록된 고정비 항목</h2>
      <div id="templateList"></div>
      <button class="add-btn" id="addTemplateBtn" type="button">+ 새 항목 추가</button>

      <!-- 추가/수정 폼 (평소엔 숨김) -->
      <div id="templateForm" class="template-form hidden">
        <div class="field">
          <label for="tplName">이름</label>
          <input type="text" id="tplName" placeholder="예: 주택담보대출 이자">
        </div>
        <div class="field">
          <label>담당자</label>
          <div class="seg">
            <button type="button" class="btn-toggle tpl-writer-btn" data-writer="seonyeong">선영</button>
            <button type="button" class="btn-toggle tpl-writer-btn" data-writer="hyunwoo">현우</button>
            <button type="button" class="btn-toggle tpl-writer-btn" data-writer="gongyong">공용</button>
          </div>
        </div>
        <div class="field hidden" id="tplLoggedByField">
          <label>실제 기록자 <span class="optional">(스트릭 반영용)</span></label>
          <div class="seg">
            <button type="button" class="btn-toggle tpl-loggedby-btn" data-loggedby="seonyeong">선영</button>
            <button type="button" class="btn-toggle tpl-loggedby-btn" data-loggedby="hyunwoo">현우</button>
          </div>
        </div>
        <div class="field">
          <label for="tplCategory">카테고리</label>
          <select id="tplCategory"></select>
        </div>
        <div class="field">
          <label>결제수단</label>
          <div class="seg">
            <button type="button" class="btn-toggle tpl-method-btn active" data-method="cash">현금·체크카드</button>
            <button type="button" class="btn-toggle tpl-method-btn" data-method="card">신용카드</button>
          </div>
        </div>
        <div class="field">
          <label for="tplAmount">기본 금액</label>
          <input type="number" id="tplAmount" placeholder="0" inputmode="numeric" min="0" onwheel="this.blur()">
        </div>
        <div class="form-actions">
          <button class="submit-btn ghost-btn" id="tplCancelBtn" type="button">취소</button>
          <button class="submit-btn" id="tplSaveBtn" type="button">저장</button>
        </div>
      </div>
    </section>

  </div>
</div>

<div id="toast"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
